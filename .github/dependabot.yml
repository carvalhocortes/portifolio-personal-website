# Weekly dependency updates, grouped into one PR per ecosystem so they don't
# pile up (issue #17).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major versions (TypeScript, Vite, ESLint...) change how the tools work
    # and usually need code changes: they are reviewed by hand, one at a time.
    # Security fixes still come from Dependabot alerts, and the weekly
    # outdated-majors workflow lists the majors in an issue.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: uv
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns:
          - '*'
