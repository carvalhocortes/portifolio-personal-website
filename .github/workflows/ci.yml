name: CI

# Checks every pull request (and every push to main) before it can break the
# deploy: lint with no warnings, formatting, tests and the production build.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          working-directory: e2e
          enable-cache: true

      - name: Install Python packages
        working-directory: e2e
        run: uv sync --locked

      # The browser download is cached per Playwright version (in uv.lock).
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/uv.lock') }}

      - name: Install Chromium
        working-directory: e2e
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            uv run playwright install-deps chromium
          else
            uv run playwright install --with-deps chromium
          fi

      - name: Lint the test code
        working-directory: e2e
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Builds the site, serves it with vite preview and runs every test.
      - name: Run end-to-end tests
        working-directory: e2e
        run: uv run pytest --tracing retain-on-failure

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
