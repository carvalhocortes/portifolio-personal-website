<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Meta tags -->
    <meta charset="utf-8" />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="CarvalhoCortes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Fernando Côrtes, engenheiro de software: trajetória, hobbies, trabalho voluntário e contato."
    />

    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c0c0e"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Fernando Côrtes - Engenheiro de software</title>
    <!-- /landing and /terminal show the same content: they point here. The
         build rewrites the title and og:url of each (vite.config.ts). -->
    <link rel="canonical" href="https://carvalhocortes.com.br/" />

    <!-- Link previews (LinkedIn, WhatsApp, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fernando Côrtes" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Fernando Côrtes - Engenheiro de software"
    />
    <meta
      property="og:description"
      content="Fernando Côrtes, engenheiro de software: trajetória, hobbies, trabalho voluntário e contato."
    />
    <meta property="og:url" content="https://carvalhocortes.com.br/" />
    <meta
      property="og:image"
      content="https://carvalhocortes.com.br/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo Carvalho Côrtes84 sobre um céu com nuvens"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
