lixeira:
  arquivos:
    nao-abra:
      nome: dont_open.txt
      texto: |
        I told you not to open it...

        Since you did, a few tips:
        - try "sudo help" in the Terminal;
        - on the desktop, type: up, up, down, down, left, right,
          left, right, B, A;
        - press DEL right at the start, when the computer boots;
        - and the Clock doesn't like too many clicks.
